name: Wintosh Windows build and attestation

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing release tag to receive the build archives
        required: true
        default: v0.1.0-dev
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  id-token: write
  attestations: write

jobs:
  build:
    name: Build Windows ${{ matrix.arch }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            cmake_arch: x64
          - arch: win32
            cmake_arch: Win32

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Configure CMake
        shell: pwsh
        run: cmake -S wintosh-windows -B build-${{ matrix.arch }} -G "Visual Studio 17 2022" -A ${{ matrix.cmake_arch }}

      - name: Build all Wintosh targets
        shell: pwsh
        run: cmake --build build-${{ matrix.arch }} --config Release --parallel 2

      - name: Run Foundation smoke test
        shell: pwsh
        run: .\build-${{ matrix.arch }}\Release\wintosh_foundation_smoke.exe

      - name: Package implementation, tests, documentation and licenses
        shell: pwsh
        run: |
          $stage = "package\Wintosh-${{ matrix.arch }}"
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          Copy-Item -Recurse -Force wintosh-windows (Join-Path $stage 'wintosh-windows')
          Copy-Item -Recurse -Force docs (Join-Path $stage 'docs')
          Copy-Item -Recurse -Force licenses (Join-Path $stage 'licenses')
          Copy-Item -Force LICENSE-WINTOSH-ORIGINAL-MIT.txt (Join-Path $stage 'LICENSE-WINTOSH-ORIGINAL-MIT.txt')
          Copy-Item -Force .gitattributes,.gitignore (Join-Path $stage '.')
          Compress-Archive -Path "$stage\*" -DestinationPath "package\Wintosh-${{ matrix.arch }}.zip" -Force

      - name: Attest release archive
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: package/Wintosh-${{ matrix.arch }}.zip

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: Wintosh-${{ matrix.arch }}
          path: package/Wintosh-${{ matrix.arch }}.zip
          if-no-files-found: error
