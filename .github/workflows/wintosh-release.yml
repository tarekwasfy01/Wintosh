name: Wintosh Windows build and attestation

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Release tag to create or update with the build archives
        required: true
        default: v0.2.0
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  build:
    name: Build Windows ${{ matrix.arch }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            msvc_arch: x64
          - arch: win32
            msvc_arch: x86

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Run license and provenance preflight
        shell: pwsh
        run: .\tools\Check-LicensePreflight.ps1

      - name: Activate MSVC toolchain
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: ${{ matrix.msvc_arch }}

      - name: Configure CMake
        shell: pwsh
        run: cmake -S wintosh-windows -B build-${{ matrix.arch }} -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build all Wintosh targets
        shell: pwsh
        run: cmake --build build-${{ matrix.arch }} --parallel 2

      - name: Run complete CTest smoke suite
        shell: pwsh
        run: ctest --test-dir build-${{ matrix.arch }} -C Release --output-on-failure --parallel 1

      - name: Package implementation, tests, documentation and licenses
        shell: pwsh
        run: |
          $stage = "package\Wintosh-${{ matrix.arch }}"
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          Copy-Item -Recurse -Force wintosh-windows (Join-Path $stage 'wintosh-windows')
          Copy-Item -Recurse -Force docs (Join-Path $stage 'docs')
          Copy-Item -Recurse -Force licenses (Join-Path $stage 'licenses')
          Copy-Item -Force LICENSE-WINTOSH-ORIGINAL-MIT.txt (Join-Path $stage 'LICENSE-WINTOSH-ORIGINAL-MIT.txt')
          Copy-Item -Force .gitattributes,.gitignore (Join-Path $stage '.')
          $bin = Join-Path $stage 'bin'
          $testBin = Join-Path $stage 'tests'
          New-Item -ItemType Directory -Force -Path $bin | Out-Null
          New-Item -ItemType Directory -Force -Path $testBin | Out-Null
          Copy-Item -Force "build-${{ matrix.arch }}\wintosh.exe" (Join-Path $bin 'wintosh.exe')
          Copy-Item -Force "build-${{ matrix.arch }}\wintosh_broker.exe" (Join-Path $bin 'wintosh_broker.exe')
          Get-ChildItem -Path "build-${{ matrix.arch }}" -Filter 'wintosh_*_smoke.exe' -File | Copy-Item -Destination $testBin -Force
          if (-not (Test-Path (Join-Path $bin 'wintosh.exe'))) { throw 'The main wintosh.exe was not produced' }
          Compress-Archive -Path "$stage\*" -DestinationPath "package\Wintosh-${{ matrix.arch }}.zip" -Force

      - name: Attest release archive
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: package/Wintosh-${{ matrix.arch }}.zip

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: Wintosh-${{ matrix.arch }}
          path: package/Wintosh-${{ matrix.arch }}.zip
          if-no-files-found: error

  release:
    name: Create GitHub release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download x64 package
        uses: actions/download-artifact@v4
        with:
          name: Wintosh-x64
          path: package
      - name: Download Win32 package
        uses: actions/download-artifact@v4
        with:
          name: Wintosh-win32
          path: package
      - name: Create or update GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
        shell: bash
        run: |
          gh release view "$RELEASE_TAG" >/dev/null 2>&1 || \
            gh release create "$RELEASE_TAG" --title "Wintosh $RELEASE_TAG" \
              --generate-notes --target "$GITHUB_SHA"
          gh release upload "$RELEASE_TAG" package/*.zip --clobber
